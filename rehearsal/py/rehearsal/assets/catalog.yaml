# Third-party applications Rehearsal compiles into worlds. None were written by
# the Rehearsal authors. Each entry pins the source commit inspected by the
# compiler and the published images the runner executes.
#
# split: development applications may inform compiler development;
#        holdout applications must not be inspected while developing the
#        compiler. They measure whether compilation transfers.
#
# Licences travel with any exported world bundle that contains these images.

applications:
  - name: gitea
    split: development
    domain: code collaboration / issue tracking
    license: MIT
    source:
      kind: git
      url: https://github.com/go-gitea/gitea
      ref: v28.1.0
      commit: 4ebd5e319b6a9e629bfd7a04292a6fe85b08dee9
